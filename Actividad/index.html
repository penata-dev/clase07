<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    
    <h1>Formulario de Registro</h1>

    <fieldset>
        <legend>Formulario de Registro</legend>
        <form id="formulario">

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" required>
            <p id="salidaNombre"></p>

            <label for="edad">Edad:</label>
            <input type="number" id="edad" required>
            <p id="salidaEdad"></p>
        <br>
        <label for="modalidad">Ingrese la modalidad </label>
            <select name="modalidad" id="modalidad" required>
                <option value="">Modalidad</option>
                <option value="mañana">Mañana</option>
                <option value="tarde">Tarde</option>
                <option value="noche">Noche</option>
            </select>
            <p id="infoModalidad"></p>

            <label for="correo">Correo:</label>
            <input type="email" name="correo" id="correo" required>
            <p id="salidaCorreo"></p>

            <label for="experiencia">Ingrese su campo de experiencia </label>
            <select name="experiencia" id="experiencia" required>
                <option value="">Seleccione una opcion</option>
                <option value="principiante">Principiante</option>
                <option value="intermedio">Intermedio</option>
                <option value="avanzado">Avanzado</option>
            </select>
            <p id="infoExperiencia"></p>

                <button type="submit" id=>Enviar</button>
        <p id="resultado"></p>

        </form>
    </fieldset>
<br>

    <script src="js/main.js"></script>
</body>
</html>
